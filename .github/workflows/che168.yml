name: CHE168 catalog

on:

  workflow_dispatch:

  schedule:
    - cron: '23 * * * *'


permissions:
  contents: write


concurrency:
  group: che168-catalog
  cancel-in-progress: false


jobs:

  scrape:

    runs-on: ubuntu-latest

    timeout-minutes: 20


    env:
      VTB_CNY_RATE: ${{ vars.VTB_CNY_RATE }}


    steps:

      - name: Получить код
        uses: actions/checkout@v7
        with:
          ref: main


      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false


      - name: Установить Playwright
        run: npm install --no-save playwright


      - name: Установить Chromium
        run: npx playwright install chromium --with-deps


      - name: Обновить автомобили CHE168
        run: node scrape.js


      - name: Рассчитать итоговую стоимость
        run: node pricing.js


      - name: Сохранить cars.json и rates.json
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add cars.json rates.json

          if git diff --cached --quiet; then

            echo "Изменений нет."

          else

            git commit \
              -m "Update CHE168 catalog and pricing"

            git push

          fi
