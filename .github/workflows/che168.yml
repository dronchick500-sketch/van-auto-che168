name: CHE168 catalog

on:

  # Можно запускать вручную
  workflow_dispatch:

  # Автоматическое обновление раз в час
  schedule:
    - cron: '23 * * * *'


# Разрешаем workflow обновлять cars.json
permissions:
  contents: write


# Не запускаем два парсера одновременно
concurrency:
  group: che168-catalog
  cancel-in-progress: false


jobs:

  scrape:

    runs-on: ubuntu-latest

    timeout-minutes: 15


    steps:

      - name: Получить код
        uses: actions/checkout@v7
        with:
          ref: main


      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false


      - name: Установить Playwright
        run: npm install --no-save playwright


      - name: Установить Chromium
        run: npx playwright install chromium --with-deps


      - name: Обновить автомобили CHE168
        run: node scrape.js


      - name: Сохранить cars.json
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add cars.json


          if git diff --cached --quiet; then

            echo "Изменений в каталоге нет."

          else

            git commit \
              -m "Update CHE168 catalog"

            git push

          fi
